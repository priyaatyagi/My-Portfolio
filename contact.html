<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Priya Tyagi</title>
  <meta name="description" content="Portfolio of Priya Tyagi, BCA student and aspiring web developer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">Priya<span> Tyagi</span></a>
    <nav id="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="about.html">About me</a>
      <a href="skills.html">Skills</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <div class="header-actions">
      <button id="themeBtn" class="icon-btn" aria-label="Switch to dark theme">Dark</button>
      <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="nav">Menu</button>
    </div>
  </header>

  <main>
    <section id="contact" class="section">
      <h2>Contact</h2>
      <p class="about-text">Have a project or question? Send me a message and I'll reply by email.</p>

      <form id="contactForm" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <small class="error" id="nameError"></small>

        <label for="email">Your email</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <small class="error" id="emailError"></small>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>
        <small class="error" id="messageError"></small>

        <button type="submit" class="btn btn-primary">Send message</button>
        <p id="formStatus" role="status"></p>
      </form>

      <p class="direct">Or write to me directly at <a id="mailLink" href="mailto:pt5115775@gmail.com">pt5115775@gmail.com</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Priya Tyagi. Built with HTML, CSS and JavaScript.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
